<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action = "URL server">
        <fieldset>
        <legend>Registration Form</legend>
        <br>
        <label for = "name">Name:</label>
        <input type = "text" id = "name" value = "name" placeholder ="Enter your name" >
        <br>
        <br>
        <label for = "email">Email:</label>
        <input type = "email" id = "email" value = "email" placeholder="Enter your email address">
        <br>
        <br>
        <label for = "mobileNumber">Mobile Number:</label>
        <input type = "tel" id = "mobileNumber" value = "phone" placeholder="Enter your mobile number">
        <br>
        <br>
        <label for = "date">DOB :</label>
        <input type = "date" id = "date" name = "DOB" min = "2001-01-01" max = 2005-12-31>
        <br>
        <br>
        <label>Gender</label>
        <br>
        <input type = "radio" id = "male" value = "male" name = "Gender">
        <label for = "male">Male</label>
       
        <input type = "radio" id = "female" value = "female" name = "Gender">
        <label for = "female">Female</label>
        
        <input type = "radio" id = "other" value = "other" name = "Gender">
        <label for = "other">other</label>
        <br>
        <br>
        <label for = "jobTitle">Job Title:</label>
        <input type = "text" id = "jonTitle" value = " " placeholder = "Enter your job title" >
        <br><br>
        <label for = "dep">Department:</label>
        <select name = "Department" id = "dep">
            <option value = "" disabled selected >select your Department</option>
            <option value = "Engineer">Engineer</option>
            <option value = "Doctor">Doctor</option>
            <option value = "Civil">Civil</option>
            <option value = "Teacher">Teacher</option>
        </select>
        <br><br>
        <button>Submit</button>
        </fieldset>
    </form>
</body>
</html>
